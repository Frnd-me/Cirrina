services:
  etcd:
    image: "quay.io/coreos/etcd:v3.5.7"
    container_name: "etcd"
    ports:
      - "2379:2379"
    command:
      - "/usr/local/bin/etcd"
      - "--name"
      - "s1"
      - "--listen-client-urls"
      - "http://0.0.0.0:2379"
      - "--advertise-client-urls"
      - "http://0.0.0.0:2379"
  neo4j:
    image: neo4j:5.26.32-community
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-password}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    volumes:
      - trace-neo4j:/data
    healthcheck:
      test: [ 'CMD-SHELL', 'cypher-shell -u neo4j -p "$${NEO4J_AUTH#*/}" "RETURN 1"' ]
      interval: 5s
      timeout: 10s
      retries: 20
volumes:
  trace-neo4j:
